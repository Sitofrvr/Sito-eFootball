.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px;cursor:pointer}.rimg{min-height:150px;background:#071230}.rimg img{width:100%;height:auto;display:block}.rb{padding:14px}.rb b{font-size:18px}.rb small{display:block;color:var(--dim);margin:2px 0 4px}.rb p{margin:6px 0 0}

.lgbox{position:absolute;top:14px;inset-inline-end:14px;display:flex;align-items:center;gap:4px;background:#0b1e48;border:1.5px solid var(--line);color:var(--txt);border-radius:12px;padding:6px 10px;font-size:20px;line-height:1;cursor:pointer;z-index:4}.lgbox small{font-size:11px;color:var(--dim)}
.pop{position:fixed;inset:0;z-index:15}.pop>div{position:absolute;top:calc(58px + env(safe-area-inset-top));inset-inline-end:14px;width:240px;max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--blue);border-radius:16px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.pop button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--txt);padding:10px;border-radius:10px;font:500 15px system-ui;cursor:pointer;text-align:start}.pop button.on{background:#0b1e48;color:var(--ice)}.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.tag.out{background:#3a0f14;border-color:#c0392b;color:#ff9a9a}.tag.upd{background:#0f3a1f;border-color:#2ecc71;color:#8dffb8}
.chip.out{border-color:#c0392b;color:#ff9a9a}.chip.upd{border-color:#2ecc71;color:#8dffb8}.chip.on.out{background:#c0392b;color:#fff;border-color:#c0392b}.chip.on.upd{background:#2ecc71;color:#032a14;border-color:#2ecc71}
.stp{display:flex;gap:8px;align-items:center;margin-top:6px}.stp .btn{width:56px;flex:none}.stp input{text-align:center}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin:8px 0 4px}.bc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.bc i{display:block;width:100%;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px}.bc small{font-size:9px;color:var(--dim);height:12px}
.pb{height:6px;background:#10265a;border-radius:3px;margin-top:6px}.pb i{display:block;height:100%;background:var(--blue);border-radius:3px}
</style></head>

<script>
const API="https://sito.olydccx.workers.dev", CH="https://t.me/efootxifriendly", MINI="https://t.me/SitoAgentBOT/Sito";
if(!localStorage.getItem("vid"))localStorage.setItem("vid",Math.random().toString(36).slice(2,12)+Date.now().toString(36));
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const TT=window.T||{en:{}};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LANGS=[["en","🇬🇧","English"],["es","🇪🇸","Español"],["ar","🇸🇦","العربية"],["hi","🇮🇳","हिन्दी"],["bn","🇧🇩","বাংলা"],["ja","🇯🇵","日本語"],["ko","🇰🇷","한국어"],["ru","🇷🇺","Русский"],["de","🇩🇪","Deutsch"],["id","🇮🇩","Bahasa Indonesia"],["ms","🇲🇾","Bahasa Melayu"],["pt","🇧🇷","Português (Brasil)"]];
let LG=(()=>{const s=localStorage.getItem("lg");if(s&&TT[s])return s;const b=String(tg?.initDataUnsafe?.user?.language_code||navigator.language||"en").toLowerCase().split("-")[0];return TT[b]?b:"en"})();
const tr=k=>(TT[LG]&&TT[LG][k])||TT.en[k]||k;
const applyDir=()=>{document.documentElement.lang=LG;document.documentElement.dir=LG==="ar"?"rtl":"ltr"};applyDir();
let S={apps:[],tuts:[],lock:true,member:false,admin:false,preview:false,ident:false,maint:null,tb:{}},tab="home",as="owner",q="",F={},asked=false,boot=true,FT=[],SORT="new",LD=null,W=false,IM=[],IMi=0,HI=0,tx=0,AT,MT,CT,CS,RP={},AP="",RS=null,DP=null,CTT="bug",NS={};
try{NS=JSON.parse(localStorage.getItem("ns")||"{}")}catch{NS={}}
const nsSave=()=>localStorage.setItem("ns",JSON.stringify(NS));
const TH={},TAGS=["iOS","Android","Online","Offline","Outdated","Updated"],tcl=t=>t==="Outdated"?"out":t==="Updated"?"upd":"";
const call=async(p,b={})=>{try{return await(await fetch(API+"/"+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg?.initData||"",key:localStorage.getItem("k")||"",session:localStorage.getItem("ss")||"",vid:localStorage.getItem("vid")||"",lg:LG,...b})})).json()}catch{return{error:"network"}}};
const go=u=>/t\.me/.test(u)&&tg?tg.openTelegramLink(u):tg?tg.openLink(u):window.open(u,"_blank");
const mem=()=>S.admin?as!=="visitor":S.member;
const mOn=()=>!!(S.maint&&S.maint.on&&(!S.maint.end||Date.now()/1000<S.maint.end));
const hay=(o,ks)=>ks.map(k=>o[k]||"").join(" ").toLowerCase();
const bd=x=>{if(x.nb==="off")return"";const n=Date.now()/1000,a=x.nt||x.t;return n-a<604800?tr("b_new"):n-x.u<604800?tr("b_upd"):""};
const bdh=x=>bd(x)?`<span class="bd">${bd(x)}</span>`:"";
const bdx=x=>x.cs?`<span class="bd gold">${tr("soon")}</span>`:x.st==="draft"?'<span class="bd">Draft</span>':bdh(x);
const tagsHtml=x=>x.tags?.length?`<div class="tags">${x.tags.map(t=>`<span class="tag ${tcl(t)}">${esc(t)}</span>`).join("")}</div>`:"";
const L={version:"l_version",publisher:"l_publisher",req:"l_req",cat:"l_cat",size:"l_size",price:"l_price"};
const dstr=t=>t?new Date(t*1000).toLocaleDateString(LG,{month:"short",day:"numeric",year:"numeric"}):"";
const dtstr=t=>new Date(t*1000).toLocaleString(LG,{dateStyle:"medium",timeStyle:"short"});
const cdHtml=s=>[[Math.floor(s/86400),"mt_d"],[Math.floor(s%86400/3600),"mt_h"],[Math.floor(s%3600/60),"mt_m"],[s%60,"mt_s"]].map(([n,l])=>`<div><b>${String(n).padStart(2,"0")}</b><small>${tr(l)}</small></div>`).join("");
function modal(h){$("#m").innerHTML=`<div class="modal" onclick="if(event.target===this)$('#m').innerHTML=''"><div class="sheet">${h}</div></div>`}
const xb=`<button class="x" aria-label="Close" onclick="$('#m').innerHTML=''">✕</button>`;

// ---------- "New!" marks on the bottom tabs ----------
const latest=k=>Math.max(0,...(k==="apps"?S.apps.filter(x=>!x.cs).map(x=>x.t||0):k==="tuts"?S.tuts.map(x=>x.t||0):[]));
const isNew=k=>{const c=(S.tb||{})[k];if(!c||!c.m||c.m==="off")return false;if(c.m==="on")return (NS[k+"v"]||0)<(c.v||0);return (k==="apps"||k==="tuts")&&latest(k)>(NS[k+"t"]||0)};
const markSeen=k=>{const c=(S.tb||{})[k]||{};NS[k+"v"]=c.v||0;if(k==="apps"||k==="tuts")NS[k+"t"]=latest(k);nsSave()};

async function load(){const m=location.hash.match(/^#c=([0-9a-f]+)$/);
 if(m){history.replaceState(null,"",location.pathname);const x=await call("redeem",{code:m[1]});if(x.session)localStorage.setItem("ss",x.session);else alert("This link expired. Open the site in Telegram and make a new one.")}
 const r=await call("init");if(r.error){$("#v").innerHTML=`<p class="empty">${tr("err_srv")}</p>`;return}
 S={...S,...r};
 if(!S.ident&&localStorage.getItem("ss"))localStorage.removeItem("ss");
 if(tg?.initDataUnsafe?.start_param==="reg"&&!sessionStorage.getItem("reg")){sessionStorage.setItem("reg","1");autoReg()}
 if(!localStorage.getItem("ns")&&!mOn()){NS={appst:latest("apps"),tutst:latest("tuts")};nsSave()}
 if(boot){boot=false;if(S.admin&&/[?&]tab=admin/.test(location.search))tab="admin"}
 if(location.hash==="#admin"&&S.preview&&!S.admin&&!asked){asked=true;const k=prompt("Preview key");if(k){localStorage.setItem("k",k);return load()}}
 draw()}

function draw(np){clearInterval(MT);clearInterval(AT);
 if(mOn()&&(!S.admin||as!=="owner"))return maint();
 if(tab!=="admin")markSeen(tab);
 const tabs=[["home","nav_home"],["apps","nav_apps"],["tuts","nav_tuts"],["social","nav_social"],["more","nav_more"]];
 $("#nav").innerHTML=tabs.map(([k,n])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';draw()">${tr(n)}${isNew(k)?`<i class="nw">${tr("b_new")}!</i>`:""}</button>`).join("")+(S.admin&&as==="owner"?`<button class="${tab==="admin"?"on":""}" onclick="AP='';tab='admin';draw()">Admin</button>`:"");
 $("#bar").innerHTML=S.admin&&as!=="owner"?`<div class="bar">Previewing as ${as==="member"?"Member":"Visitor"} · <u onclick="as='owner';draw()">Exit</u></div>`:S.admin&&mOn()?`<div class="bar red">Maintenance is ON · <u onclick="mtOpen()">Edit</u> · <u onclick="mtOff()">Turn off</u></div>`:"";
 ({home,apps,tuts,social,more,admin})[tab]();window.scrollTo(0,0);if(!np&&needReg())regPop()}

// ---------- maintenance screen ----------
function maint(){const m=S.maint||{},end=m.end||0;$("#nav").innerHTML="";
 $("#bar").innerHTML=S.admin?`<div class="bar">Previewing as ${as==="member"?"Member":"Visitor"} · <u onclick="as='owner';draw()">Exit</u></div>`:"";
 $("#v").innerHTML=`<div class="hero mt"><div class="sp"><img src="logo.png" alt=""></div><h1>${esc(m.title||tr("mt_title"))}</h1>${m.msg?`<p style="white-space:pre-wrap">${esc(m.msg)}</p>`:""}${end&&m.cd?`<div class="cd" id="cd"></div>`:""}${end?`<p>${tr("mt_ends")}: <b>${esc(dtstr(end))}</b></p>`:""}${m.btn?`<button class="btn p" onclick="go(CH)">${tr("mt_join")}</button>`:""}</div>`;
 if(end&&m.cd){const tick=()=>{const s=Math.max(0,end-Math.floor(Date.now()/1000)),e=$("#cd");if(!e)return;e.innerHTML=cdHtml(s);if(s<=0){clearInterval(MT);setTimeout(load,3000)}};tick();MT=setInterval(tick,1000)}
 else if(end)MT=setTimeout(load,Math.min(3e8,Math.max(1000,end*1000-Date.now()+1500)))}

// ---------- home ----------
const getImg=async id=>{if(!(id in TH)){const r=await call("app",{id});TH[id]=r.img||""}return TH[id]};
const ico=x=>x.icon?`<img src="${x.icon}" alt="">`:`<div class="ic" data-ic="${x.id}"></div>`;
async function fi(){for(const e of document.querySelectorAll("[data-ic]")){const s=await getImg(+e.dataset.ic);if(s)e.outerHTML=`<img src="${s}" alt="">`}}
async function fh(){for(const e of document.querySelectorAll("[data-hi]")){const s=await getImg(+e.dataset.hi);if(s)e.innerHTML=`<img src="${s}" alt="">`}}
const rcard=x=>{const t=x.desc||x.log||"",ex=t.length>110?t.slice(0,110).trimEnd()+"..":t;
 return `<div class="rc" onclick="show(${x.id})"><div class="rimg" data-hi="${x.id}"></div><div class="rb"><b>${esc(x.name)}</b>${x.ft?`<span class="bd gold">${tr("featured")}</span>`:bdx(x)}<small>${esc([x.version,x.size,dstr(x.t)].filter(Boolean).join(" · "))}${x.lk?` · ♥ ${x.lk}`:""}</small>${tagsHtml(x)}${ex?`<p>${esc(ex)}</p>`:""}</div></div>`};
const rec=()=>{const vis=S.apps.filter(x=>!x.cs).sort((a,b)=>(b.t||0)-(a.t||0)||b.id-a.id),ft=vis.find(x=>x.ft),rest=vis.filter(x=>!x.ft).slice(0,5),cs=S.apps.filter(x=>x.cs);
 return (ft?`<h3>${tr("featured")}</h3>${rcard(ft)}`:"")+(cs.length?`<h3>${tr("soon")}</h3>`+cs.map(x=>`<div class="card" onclick="show(${x.id})">${ico(x)}<div><b>${esc(x.name)}${bdx(x)}</b><small>${esc(dtstr(x.at))}</small></div></div>`).join(""):"")+(rest.length?`<h3>${tr("recent")}</h3>`+rest.map(rcard).join(""):"")};
function home(){$("#v").innerHTML=`<button class="lgbox" onclick="lgOpen()" aria-label="${tr("language")}">${(LANGS.find(l=>l[0]===LG)||LANGS[0])[1]}<small>▾</small></button><div class="hero"><img class="logo" src="logo.png" alt=""><h1>Sito eFootball</h1><p>${tr("welcome")}</p><button class="btn p" onclick="go(CH)">${tr("join_tg")}</button><br><input placeholder="${tr("search_all")}" aria-label="${tr("search_all")}" oninput="gs(this.value)" style="margin-top:14px"></div><div id="sug" style="margin-top:14px"></div><div id="rec">${rec()}</div>`;fh();fi()}

async function pgTools(){$("#v").innerHTML=`${bk("")}<h2>Site tools</h2><p class="empty">Loading…</p>`;const l=await call("admin",{op:"links"});if(AP!=="tools")return;
 const rows=Object.values(l.ls||{}).sort((a,b)=>(a.n||"").localeCompare(b.n||"")).map(e=>`<div class="row"><b>${e.s==="ok"?"✅":e.s==="dead"?"❌":"❓"} ${esc(e.n)}</b> <small style="display:inline">${esc(e.f)} · ${ago(e.ts)}</small></div>`).join("");
 $("#v").innerHTML=`${bk("")}<h2>Site tools</h2><div class="row"><small>Require channel join</small><button class="btn ${S.lock?"p":""}" onclick="lk()">${S.lock?"On (tap to turn off)":"Off (tap to turn on)"}</button></div>
 <button class="btn ${mOn()?"dn":""}" style="margin-bottom:6px" onclick="mtOpen()">Maintenance${mOn()?" (ON)":""}</button>
 <h3>Backup</h3><button class="btn" onclick="bkNow()">Send backup to my Telegram</button><small class="lab" style="margin:12px 0 6px">Restore from a backup file</small><input type="file" accept=".json,application/json" onchange="rsPick(this)">
 <h3>Link health</h3><p>${Object.keys(l.ls||{}).length} of ${l.total||0} links checked. The bot checks 10 every 4 hours.</p>${rows}<button class="btn" style="margin-top:8px" onclick="chkNow()">Check next 10 now</button>`}
async function bkNow(){const r=await call("admin",{op:"backup"});alert(r.ok?`Backup sent to your Telegram (${Math.round(r.bytes/1024)} KB).`:r.error||"Failed")}
async function rsPick(e){const f=e.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text())}catch{return alert("That is not a valid backup file.")}RS=d;
 cfm("Restore this backup? Items with the same ID are overwritten. Nothing is deleted.","Restore",async()=>{const r=await call("admin",{op:"restore",data:RS});alert(r.ok?`Restored ${r.items} items.`:r.error||"Failed");await load();tab="admin";draw()})}
async function chkNow(){await call("admin",{op:"check"});admin()}
function live(){clearInterval(AT);AT=setInterval(async()=>{if(tab!=="admin"||(!$("#sv")&&!document.querySelector("[id^=pa]"))){clearInterval(AT);return}const s=await call("admin",{op:"stats"});if(s.error)return;
 const sv=$("#sv");if(sv){sv.textContent=`${s.visits} total · ${s.today} today · 🟢 ${s.online} online`;$("#sdl").textContent=s.downloads}S.apps.forEach(x=>{const e=$("#pa"+x.id);if(e)e.textContent=ptxt(s,x)})},8000)}
async function lk(){await call("admin",{op:"lock",v:!S.lock});S.lock=!S.lock;admin()}
// confirmation with a 5-second lock (Cancel is instant)
function cfm(msg,label,fn){let n=5;modal(`<h2>${esc(msg)}</h2><button class="btn" onclick="cx()">Cancel</button><button class="btn dn" id="cb" disabled>${esc(label)} (5)</button>`);
 clearInterval(CT);CT=setInterval(()=>{n--;const b=$("#cb");if(!b){clearInterval(CT);return}if(n>0)b.textContent=`${label} (${n})`;else{clearInterval(CT);b.disabled=false;b.textContent=label;b.onclick=()=>{$("#m").innerHTML="";fn()}}},1000)}
const cx=()=>{clearInterval(CT);$("#m").innerHTML=""};
function del(kind,id){cfm("Delete this "+(kind==="apps"?"app":"tutorial")+"?","Delete",async()=>{await call("admin",{op:"del",kind,id});await load();tab="admin";draw()})}
// maintenance form (5 fields)
function mtOpen(){const m=S.maint||{},on=mOn(),v=m.end?new Date(m.end*1000-new Date(m.end*1000).getTimezoneOffset()*60000).toISOString().slice(0,16):"";
 modal(`${xb}<h2>Maintenance</h2><p>Visitors will only see this screen.</p><input id="mt_t" placeholder="Title (default: We’ll be right back)" value="${esc(m.title||"")}" style="margin-bottom:8px"><textarea id="mt_m" rows="3" placeholder="Message" style="margin-bottom:8px">${esc(m.msg||"")}</textarea>
 <small class="lab">Ends at, in your time zone (optional)</small><input id="mt_e" type="datetime-local" value="${v}" style="margin:6px 0 12px">
 <label class="ck"><input type="checkbox" id="mt_c" ${m.cd!==false?"checked":""}> Show countdown</label><label class="ck"><input type="checkbox" id="mt_b" ${m.btn?"checked":""}> Show “Join our Telegram” button</label>
 ${on?`<button class="btn p" onclick="mtSave(true)">Save changes</button><button class="btn" onclick="mtOff()">Turn off</button>`:`<button class="btn dn" onclick="mtAsk()">Start maintenance</button>`}`)}
function mtVals(){const v=$("#mt_e").value;return{title:$("#mt_t").value.trim(),msg:$("#mt_m").value.trim(),end:v?Math.floor(new Date(v).getTime()/1000):0,cd:$("#mt_c").checked,btn:$("#mt_b").checked}}
function mtAsk(){const d=mtVals();if(d.end&&d.end<=Date.now()/1000)return alert("The end time must be in the future.");cfm("Start maintenance? Visitors will only see the maintenance screen.","Start",()=>mtSave(true,d))}
async function mtSave(on,d){d=d||mtVals();if(on&&d.end&&d.end<=Date.now()/1000)return alert("The end time must be in the future.");await call("admin",{op:"maint",data:{...d,on}});$("#m").innerHTML="";await load();tab="admin";draw()}
async function mtOff(){await call("admin",{op:"maint",data:{...(S.maint||{}),on:false}});$("#m").innerHTML="";await load();tab="admin";draw()}

// ---------- app and tutorial forms ----------
const AF=[["name","App name"],["version","Version"],["log","What’s new (changelog)","t"],["publisher","Publisher"],["req","Requirements"],["cat","Category"],["size","Size"],["price","Price"],["safety","Safety label"],["desc","Description","t"],["url","Android link (MediaFire)"],["ios","iOS link (MediaFire)"],["res","Resources link (MediaFire, optional)"]],TF=[["title","Title"],["text","Text","t"],["video","Telegram video link"]];
const PRE={name:["eFootxi 27","Kipas FOOTBALL","eFootball73"],publisher:["Sito (Owner)"],price:["Free"],safety:["100% Safe and Tested"]},MAND=["name"];
const mand=k=>F.kind==="apps"&&MAND.includes(k);
function shrink(f,max,q,sq,mime){return new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas"),x=c.getContext("2d");if(sq){c.width=c.height=sq;const m=Math.min(i.width,i.height);x.drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,sq,sq)}else{const k=Math.min(1,max/Math.max(i.width,i.height));c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);x.drawImage(i,0,0,c.width,c.height)}r(c.toDataURL(mime||"image/webp",q))};i.src=URL.createObjectURL(f)})}
const thumb=u=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=192;const m=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,192,192);r(c.toDataURL("image/webp",.8))};i.onerror=()=>r("");i.src=u});
async function openForm(kind,id){let d={};
 if(id){d={...S[kind].find(x=>x.id===id)};if(kind==="apps"){const r=await call("app",{id});if(r.error)return alert("Couldn’t load the images. Try again.");d.img=r.img||"";d.shots=r.shots||[]}}
 else if(kind==="apps")d={publisher:"Sito (Owner)",shots:[],old:[]};
 F={kind,id,d,hide:{}};(kind==="apps"?AF:TF).forEach(([k])=>{if(id&&!d[k]&&!mand(k))F.hide[k]=1});rf()}
function collect(){(F.kind==="apps"?AF:TF).forEach(([k])=>{const e=$("#f_"+k);if(e)F.d[k]=e.value});["fl","fo","fb"].forEach(k=>{const e=$("#f_"+k);if(e)F.d[k]=Math.max(0,parseInt(e.value)||0)});const a=$("#f_at");if(a)F.d.at=a.value?Math.floor(new Date(a.value).getTime()/1000):0}
const imgs=()=>`<div class="row"><small>Main image (always the first preview)</small>${F.d.img?`<div class="th"><img src="${F.d.img}" alt=""><b onclick="collect();F.d.img='';F.d.icon='';rf()">✕</b></div>`:""}<input type="file" accept="image/*" onchange="pm(this)"></div>
<div class="row"><small>Preview images (up to 6)</small><div class="ths">${(F.d.shots||[]).map((s,i)=>`<div class="th"><img src="${s}" alt=""><b onclick="collect();F.d.shots.splice(${i},1);rf()">✕</b></div>`).join("")}</div><input type="file" accept="image/*" multiple onchange="ps(this)"></div>`;
const tagsUi=()=>`<div class="row"><small>Tags</small><div class="chips" style="margin:6px 0 0">${TAGS.map(t=>`<span class="chip ${tcl(t)} ${(F.d.tags||[]).includes(t)?"on":""}" onclick="tgl('${t}')">${t}</span>`).join("")}</div></div>`;
const stp=(id,lab,val)=>`<div class="row"><small>${lab}</small><div class="stp"><button class="btn" aria-label="Minus" onclick="stpb('${id}',-1)">−</button><input id="${id}" type="number" min="0" inputmode="numeric" value="${val||0}"><button class="btn" aria-label="Plus" onclick="stpb('${id}',1)">+</button></div></div>`;
const stpb=(id,n)=>{const e=$("#"+id);e.value=Math.max(0,(parseInt(e.value)||0)+n)};
const likesUi=()=>stp("f_fl",`Likes: ${F.d.lr||0} real (kept forever) + added by you`,F.d.fl)+stp("f_fo",`“Works” votes: ${F.d.okr||0} real + added by you`,F.d.fo)+stp("f_fb",`“Doesn’t work” votes: ${F.d.badr||0} real + added by you`,F.d.fb);
const statUi=()=>{const s=F.d.st||"",v=F.d.at?new Date(F.d.at*1000-new Date(F.d.at*1000).getTimezoneOffset()*60000).toISOString().slice(0,16):"";
 return `<div class="row"><small>Status</small><div class="chips" style="margin:6px 0 0">${[["","Published"],["draft","Draft (hidden)"],["sched","Scheduled"]].map(([k,l])=>`<span class="chip ${s===k?"on":""}" onclick="stSet('${k}')">${l}</span>`).join("")}</div>${s==="sched"?`<small>Releases at (your time zone)</small><input id="f_at" type="datetime-local" value="${v}" style="margin-top:6px">`:""}</div>`};
const stSet=k=>{collect();F.d.st=k;rf()};
const featUi=()=>`<div class="row"><small>Featured (pinned on Home, one app at a time)</small><div class="chips" style="margin:6px 0 0"><span class="chip ${F.d.ft?"on":""}" onclick="ftSet()">Featured</span></div></div>`;
const ftSet=()=>{collect();F.d.ft=F.d.ft?0:1;rf()};
const newUi=()=>`<div class="row"><small>Weekly “New” badge</small><div class="chips" style="margin:6px 0 0"><span class="chip ${F.d.nb==="off"?"":"on"}" onclick="nbSet('')">Auto (7 days)</span><span class="chip ${F.d.nb==="off"?"on":""}" onclick="nbSet('off')">Off</span><span class="chip" onclick="nbRestart()">Restart 7 days</span></div></div>`;
const nbSet=v=>{collect();F.d.nb=v;rf()};
const nbRestart=()=>{collect();F.d.nb="";F.d.nt=Math.floor(Date.now()/1000);rf();alert("The New badge will show for 7 days after you save.")};
const histUi=()=>`<div class="row"><small>Older versions</small><button class="btn" style="margin-top:6px" onclick="mvHist()">Move current version to history</button>${(F.d.old||[]).map((e,i)=>`<div class="fr" style="margin-top:8px"><div style="flex:1"><b>${esc(e.v||"—")}</b> <small style="display:inline">${esc(dstr(e.d))}</small></div><b onclick="delOld(${i})">✕</b></div>`).join("")}</div>`;
function mvHist(){collect();const g=k=>String(F.d[k]||"").trim();if(!g("version")&&!g("url")&&!g("ios")&&!g("res"))return alert("Nothing to move yet.");
 F.d.old=[{v:g("version"),url:g("url"),ios:g("ios"),res:g("res"),log:g("log"),d:Math.floor(Date.now()/1000)},...(F.d.old||[])];["version","url","ios","res","log"].forEach(k=>{F.d[k]="";delete F.hide[k]});rf();alert("Moved. Now fill in the new version and its links.")}
function delOld(i){collect();F.d.old.splice(i,1);rf()}
function rf(){const fs=F.kind==="apps"?AF:TF,sh=$(".sheet"),st=sh?sh.scrollTop:0,d=F.d;
 const row=([k,l,t])=>F.hide[k]?"":`<div class="fr">${t?`<textarea id="f_${k}" rows="3" placeholder="${l}">${esc(d[k])}</textarea>`:`<input id="f_${k}" placeholder="${l}" value="${esc(d[k])}">`}${mand(k)?"":`<b role="button" aria-label="Remove ${l}" onclick="rm('${k}')">✕</b>`}</div>${F.kind==="apps"&&PRE[k]?`<div class="chips">${PRE[k].map(v=>`<span class="chip" onclick="fill('${k}',this.textContent)">${esc(v)}</span>`).join("")}</div>`:""}`;
 const gone=fs.filter(([k])=>F.hide[k]);
 modal(`<button class="x" onclick="$('#m').innerHTML=''">✕</button><h2>${F.id?"Edit":"Add"}</h2><p>Tap ✕ to remove a field. Removed fields don’t show on the site.</p>${F.kind==="apps"?imgs()+tagsUi():""}${fs.map(row).join("")}${gone.length?`<small style="color:var(--dim)">Removed fields, tap to add back</small><div class="chips">${gone.map(([k,l])=>`<span class="chip" onclick="ad('${k}')">+ ${l}</span>`).join("")}</div>`:""}${F.kind==="apps"?statUi()+featUi()+newUi()+histUi()+likesUi():newUi()}<button class="btn p" style="margin-top:12px" onclick="save()">Save</button>`);
 const n=$(".sheet");if(n)n.scrollTop=st}
const fill=(k,v)=>{$("#f_"+k).value=v};
function tgl(t){collect();const a=(F.d.tags||[]).filter(x=>!(t==="Outdated"&&x==="Updated")&&!(t==="Updated"&&x==="Outdated"));F.d.tags=a.includes(t)?a.filter(x=>x!==t):[...a,t];rf()}
function rm(k){collect();F.hide[k]=1;rf()}
function ad(k){collect();delete F.hide[k];rf()}
async function pm(e){const f=e.files[0];if(!f)return;collect();F.d.img=await shrink(f,800,.72);F.d.icon=await shrink(f,0,.8,192);rf()}
async function ps(e){collect();F.d.shots=F.d.shots||[];for(const f of [...e.files]){if(F.d.shots.length>=6)break;F.d.shots.push(await shrink(f,800,.72))}rf()}
async function save(){collect();if(F.kind==="apps"&&F.d.img&&!F.d.icon)F.d.icon=await thumb(F.d.img);const fs=F.kind==="apps"?AF:TF,data={};fs.forEach(([k])=>{const v=F.hide[k]?"":String(F.d[k]||"").trim();if(v)data[k]=v});
 if(F.kind==="apps"){if(!data.name||(!data.url&&!data.ios))return alert("App name and at least one download link are required.");
  if(F.d.st==="sched"&&(!F.d.at||F.d.at<=Date.now()/1000))return alert("Pick a release date and time in the future, or choose Published.");
  if(F.d.img)data.img=F.d.img;if(F.d.icon)data.icon=F.d.icon;if(F.d.shots?.length)data.shots=F.d.shots;if(F.d.tags?.length)data.tags=F.d.tags;
  ["fl","fo","fb"].forEach(k=>{if(F.d[k]>0)data[k]=F.d[k]});if(F.d.old?.length)data.old=F.d.old;if(F.d.st)data.st=F.d.st;if(F.d.st==="sched")data.at=F.d.at;if(F.d.ft)data.ft=1}
 else if(!Object.keys(data).length)return alert("Fill in at least one field.");
 if(F.d.nb==="off")data.nb="off";if(F.d.nt)data.nt=F.d.nt;
 const r=await call("admin",{op:"save",kind:F.kind,id:F.id,data});if(r.ok){$("#m").innerHTML="";await load();tab="admin";draw()}else alert(r.error||"Could not save")}
load();
const ping=()=>{if(!document.hidden)call("ping")};setTimeout(ping,3000);setInterval(ping,15000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
