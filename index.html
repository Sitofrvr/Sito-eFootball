<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sito eFootball</title>
<meta property="og:title" content="Sito eFootball">
<meta property="og:description" content="Welcome to Sito Web! Here you can find all the mods published. Join my telegram for advanced news!">
<meta property="og:image" content="https://sitofrvr.github.io/Sito-eFootball/banner.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="logo.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b1c;--card:#0a1530;--line:#1b3a73;--blue:#3d8bff;--ice:#9ad7ff;--txt:#e8f1ff;--dim:#8ea6cc}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,sans-serif}
body{padding:0 0 calc(76px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
h1,h2,h3,.nav button{font-family:"Chakra Petch",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:22px 18px}
.hero{text-align:center;padding-top:10px}
.logo{width:190px;height:190px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 6px #0b1d46,0 0 60px 14px rgba(61,139,255,.55)}
h1{font-size:34px;margin:28px 0 6px}h2{font-size:26px;margin:6px 0 16px}
p{color:var(--dim);margin:0 0 16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:26px;border:1.5px solid var(--blue);background:#0b1e48;color:var(--txt);font:500 16px system-ui;cursor:pointer;text-decoration:none;padding:10px 18px}
.btn.p{background:var(--blue);color:#02112b;font-weight:700}.btn+.btn{margin-top:10px}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.nav button:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
input,textarea{width:100%;background:#071230;border:1.5px solid var(--line);border-radius:14px;color:var(--txt);padding:12px 14px;font:16px system-ui;margin:0}
.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;cursor:pointer}
.card img,.ic{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;background:#10265a}
.card b{display:block;font-size:17px}.card small{color:var(--dim)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#070f26;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--dim);padding:16px 2px;font-size:14px;cursor:pointer}
.nav button.on{color:var(--ice);text-shadow:0 0 14px var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
.modal{position:fixed;inset:0;background:rgba(2,6,16,.8);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);border:1px solid var(--blue);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 0 40px rgba(61,139,255,.35)}
.row{background:#071230;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}.row small{display:block;color:var(--dim)}
.x{float:right;background:none;border:1.5px solid var(--blue);color:var(--txt);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
.fr{display:flex;gap:6px;margin-bottom:8px}.fr b{cursor:pointer;padding:10px;color:var(--dim)}
.bar{background:var(--blue);color:#02112b;text-align:center;padding:8px;font-weight:700;position:sticky;top:0}
.seg{display:flex;gap:6px;margin-bottom:14px}.seg .btn{min-height:42px;font-size:14px}.empty{text-align:center;color:var(--dim);padding:30px 0}
.bd{background:var(--blue);color:#02112b;font:700 11px "Chakra Petch",sans-serif;border-radius:8px;padding:2px 8px;margin-left:8px;vertical-align:middle}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px}.chip{background:#0b1e48;border:1px solid var(--line);color:var(--ice);border-radius:14px;padding:5px 12px;font-size:14px;cursor:pointer}
.ths{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.th{position:relative;display:inline-block;margin:6px 0}.th img{width:92px;height:92px;object-fit:cover;border-radius:10px;display:block}.th b{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;cursor:pointer;font-size:13px}
.lb{position:fixed;inset:0;background:rgba(2,6,15,.94);z-index:20;display:flex;align-items:center;justify-content:center}.lb img{max-width:100%;max-height:82vh;object-fit:contain}.lbx{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:#0a1530}
.ar{position:absolute;top:50%;transform:translateY(-50%);background:rgba(10,21,48,.85);border:1.5px solid var(--blue);color:var(--txt);width:46px;height:46px;border-radius:50%;font-size:28px;line-height:1;cursor:pointer}.ar.l{left:10px}.ar.r{right:10px}
.ct{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:var(--dim)}
</style></head>
<body>
<div id="bar"></div><main id="v"></main>
<nav class="nav" id="nav"></nav><div id="m"></div><div id="m2"></div>
<script>
// ===== EDIT THIS =====
const API="https://sito.olydccx.workers.dev", CH="https://t.me/efootxifriendly";
// =====================
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={apps:[],tuts:[],lock:true,member:false,admin:false,preview:false},tab="home",as="owner",q="",F={},asked=false;
const call=async(p,b={})=>{try{return await(await fetch(API+"/"+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg?.initData||"",key:localStorage.getItem("k")||"",session:localStorage.getItem("ss")||"",...b})})).json()}catch{return{error:"network"}}};
const go=u=>/t\.me/.test(u)&&tg?tg.openTelegramLink(u):tg?tg.openLink(u):window.open(u,"_blank");
const mem=()=>S.admin?as!=="visitor":S.member;
const L={version:"Version",publisher:"Publisher",req:"Requirements",cat:"Category",size:"Size",price:"Price"};
async function load(){const m=location.hash.match(/^#c=([0-9a-f]+)$/);if(m){history.replaceState(null,"",location.pathname);const x=await call("redeem",{code:m[1]});if(x.session)localStorage.setItem("ss",x.session);else alert("This link expired. Open the site in Telegram and make a new one.")}
 const r=await call("init");if(r.error){$("#v").innerHTML='<p class="empty">Can’t reach the server. Try again later.</p>';return}
 S={...S,...r};if(location.hash==="#admin"&&S.preview&&!S.admin&&!asked){asked=true;const k=prompt("Preview key");if(k){localStorage.setItem("k",k);return load()}}draw()}
function draw(){
 const tabs=[["home","Home"],["apps","Apps"],["tuts","Tutorials"],["social","Social"],["more","More"]];if(S.admin&&as==="owner")tabs.push(["admin","Admin"]);
 $("#nav").innerHTML=tabs.map(([k,n])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';draw()">${n}</button>`).join("");
 $("#bar").innerHTML=S.admin&&as!=="owner"?`<div class="bar">Previewing as ${as==="member"?"Member":"Visitor"} · <u onclick="as='owner';draw()">Exit</u></div>`:"";
 if(!tg?.initData&&!S.member&&S.lock&&!S.admin){$("#v").innerHTML=`<div class="hero"><img class="logo" src="logo.png" alt=""><h1>Sito eFootball</h1><p>Open this site once from our Telegram channel link. Then tap “Use in my browser” in More, and it will work here too.</p><a class="btn p" href="${CH}">Open the channel</a></div>`;$("#nav").innerHTML="";return}
 ({home,apps,tuts,social,more,admin})[tab]();window.scrollTo(0,0)}
function home(){$("#v").innerHTML=`<div class="hero"><img class="logo" src="logo.png" alt=""><h1>Sito eFootball</h1><p>Welcome to Sito Web! Here you can find all the mods published. Join my telegram for advanced news!</p>
<button class="btn p" onclick="go(CH)">Join our Telegram</button><br><input placeholder="Search apps" aria-label="Search apps" onchange="q=this.value;tab='apps';draw()"></div>`}
function apps(){$("#v").innerHTML=`<h2>Apps</h2><input value="${esc(q)}" placeholder="Search apps" aria-label="Search apps" oninput="q=this.value;rl()" style="margin-bottom:14px"><div id="list"></div>`;rl()}
function rl(){const a=S.apps.filter(x=>(x.name||"").toLowerCase().includes(q.toLowerCase()));
 $("#list").innerHTML=a.map(x=>`<div class="card" onclick="show(${x.id})">${x.icon?`<img src="${x.icon}" alt="">`:'<div class="ic"></div>'}<div><b>${esc(x.name)}${bd(x)?`<span class="bd">${bd(x)}</span>`:""}</b><small>${esc([x.version,x.size,x.cat].filter(Boolean).join(" · "))}</small></div></div>`).join("")||'<p class="empty">Nothing here yet.</p>'}
function modal(h){$("#m").innerHTML=`<div class="modal" onclick="if(event.target===this)$('#m').innerHTML=''"><div class="sheet">${h}</div></div>`}
function show(id){const x=S.apps.find(a=>a.id===id);
 modal(`<button class="x" aria-label="Close" onclick="$('#m').innerHTML=''">✕</button><h2>${esc(x.name)}${bd(x)?`<span class="bd">${bd(x)}</span>`:""}</h2>
 <div id="hero">${x.icon?`<img class="ic" style="width:96px;height:96px;display:block;margin:0 auto 12px;box-shadow:0 0 30px rgba(61,139,255,.5)" src="${x.icon}" alt="">`:""}</div>
 ${x.safety?`<p style="text-align:center">${esc(x.safety)}</p>`:""}${x.desc?`<p>${esc(x.desc)}</p>`:""}${x.log?`<div class="row"><small>What’s new</small><b style="white-space:pre-wrap">${esc(x.log)}</b></div>`:""}
 ${Object.keys(L).filter(k=>x[k]).map(k=>`<div class="row"><small>${L[k]}</small><b>${esc(x[k])}</b></div>`).join("")}
 <button class="btn p" style="margin-top:12px" onclick="dl(${x.id})">Download</button>${tg?.initData||localStorage.getItem("ss")?`<button class="btn" style="margin-top:10px" onclick="rp(${x.id})">Report a broken link</button>`:""}`);loadHero(x.id)}
async function dl(id){if(S.admin&&as==="visitor"&&S.lock)return lockSheet();
 const r=await call("dl",{id});if(r.url)go(r.url);else if(r.error==="not_member")lockSheet();else alert(r.error||"Try again")}
const bd=x=>{const n=Date.now()/1000;return n-x.t<604800?"New":n-x.u<604800?"Updated":""};
async function rp(id){const r=await call("report",{id});alert(r.ok?"Thanks! The owner has been told.":r.error||"Try again")}
let IM=[],IMi=0,tx=0;
function loadHero(id){call("app",{id}).then(r=>{if(!r.img||!$("#hero"))return;IM=[r.img,...(r.shots||[])];$("#hero").style.marginBottom="12px";$("#hero").innerHTML=`<img src="${r.img}" alt="" onclick="view(0)" style="width:100%;border-radius:16px;border:1px solid var(--line);cursor:zoom-in;display:block">${IM.length>1?`<small style="display:block;text-align:center;color:var(--dim);margin-top:6px">${IM.length} images · tap to view</small>`:""}`})}
function view(i){const n=IM.length;IMi=(i+n)%n;$("#m2").innerHTML=`<div class="lb" ontouchstart="tx=event.touches[0].clientX" ontouchend="sw(event)"><button class="x lbx" aria-label="Close" onclick="$('#m2').innerHTML=''">✕</button>${n>1?`<button class="ar l" aria-label="Previous" onclick="view(IMi-1)">‹</button><button class="ar r" aria-label="Next" onclick="view(IMi+1)">›</button><div class="ct">${IMi+1} / ${n}</div>`:""}<img src="${IM[IMi]}" alt=""></div>`}
const sw=e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)view(IMi+(d<0?1:-1))};
function lockSheet(){modal(`<h2>Join the channel first</h2><p>The downloads are for channel members. Join, then come back and tap the button below.</p>
 <button class="btn p" onclick="go(CH)">Open the channel</button><button class="btn" onclick="$('#m').innerHTML='';load()">I joined, check again</button>`)}
function tuts(){$("#v").innerHTML=`<h2>Tutorials</h2>`+(S.tuts.map(t=>`<div class="card" style="display:block;cursor:default">${t.title?`<b>${esc(t.title)}</b>`:""}${t.text?`<p style="margin:6px 0 0;white-space:pre-wrap">${esc(t.text)}</p>`:""}${t.video?`<button class="btn" style="margin-top:12px" onclick="go('${esc(t.video)}')">Watch the video</button>`:""}</div>`).join("")||'<p class="empty">Nothing here yet.</p>')}
function social(){$("#v").innerHTML=`<h2>Social</h2><div class="card" onclick="go(CH)"><div class="ic" style="display:grid;place-items:center;font-size:26px">✈</div><div><b>Telegram</b><small>Tap to open</small></div></div>`}
function more(){$("#v").innerHTML=`<h2>More</h2>${extra()}<button class="btn" onclick="info('About','Sito eFootball shares mods for eFootball. New releases and news are posted first in our Telegram channel.')">About</button><button class="btn" onclick="info('Privacy','We only see your Telegram name and ID to check that you joined the channel, and to count visits and downloads. We show no ads and sell nothing.')">Privacy</button>`}
function info(t,b){modal(`<button class="x" onclick="$('#m').innerHTML=''">✕</button><h2>${t}</h2><p>${b}</p>`)}
const extra=()=>tg?.initData?'<button class="btn p" style="margin-bottom:10px" onclick="mk()">Use in my browser</button>':localStorage.getItem("ss")?'<button class="btn" style="margin-bottom:10px" onclick="so()">Sign out of this browser</button>':"";
const so=()=>{localStorage.removeItem("ss");load()};
async function mk(){const r=await call("link");if(!r.code)return alert(r.error||"Try again");window._u=location.origin+location.pathname+"#c="+r.code;
 modal(`<button class="x" onclick="$('#m').innerHTML=''">✕</button><h2>Your browser link</h2><p>Open it in Chrome once. It works one time and expires in 10 minutes. Don’t share it.</p><button class="btn p" onclick="tg.openLink(window._u)">Open in my browser</button><button class="btn" onclick="navigator.clipboard?.writeText(window._u).then(()=>alert('Copied'))">Copy link</button>`)}
// ---------- admin ----------
const AF=[["name","App name"],["version","Version"],["log","What’s new (changelog)","t"],["publisher","Publisher"],["req","Requirements"],["cat","Category"],["size","Size"],["price","Price"],["safety","Safety label"],["desc","Description","t"],["url","MediaFire link"]],TF=[["title","Title"],["text","Text","t"],["video","Telegram video link"]];
async function admin(){$("#v").innerHTML='<p class="empty">Loading…</p>';const s=await call("stats");const n=id=>(s.per?.find(p=>p.app===id)?.c)||0;
 $("#v").innerHTML=`<h2>Admin</h2><div class="row"><small>Visitors</small><b>${s.visits??0} total · ${s.today??0} today</b></div><div class="row"><small>Downloads</small><b>${s.downloads??0}</b></div>
 <div class="row"><small>Require channel join</small><button class="btn ${S.lock?"p":""}" onclick="lk()">${S.lock?"On (tap to turn off)":"Off (tap to turn on)"}</button></div>
 <small style="color:var(--dim)">View as</small><div class="seg"><button class="btn" onclick="as='member';draw()">Member</button><button class="btn" onclick="as='visitor';draw()">Visitor</button></div>
 <h3>Apps</h3>${S.apps.map(x=>`<div class="row"><b>${esc(x.name)}</b> <small>${n(x.id)} downloads</small><div class="seg" style="margin:8px 0 0"><button class="btn" onclick="openForm('apps',${x.id})">Edit</button><button class="btn" onclick="del('apps',${x.id})">Delete</button></div></div>`).join("")}<button class="btn p" onclick="openForm('apps')">Add app</button>
 <h3>Tutorials</h3>${S.tuts.map(x=>`<div class="row"><b>${esc(x.title||"Untitled")}</b><div class="seg" style="margin:8px 0 0"><button class="btn" onclick="openForm('tuts',${x.id})">Edit</button><button class="btn" onclick="del('tuts',${x.id})">Delete</button></div></div>`).join("")}<button class="btn p" onclick="openForm('tuts')">Add tutorial</button>`}
async function lk(){await call("admin",{op:"lock",v:!S.lock});S.lock=!S.lock;admin()}
async function del(kind,id){if(confirm("Delete this?")){await call("admin",{op:"del",kind,id});await load();tab="admin";draw()}}
const PRE={name:["eFootxi","Kipas FOOTBALL","eFootball73"],publisher:["Sito (Owner)"],price:["Free"],safety:["100% Safe and Tested"]},MAND=["name","url"];
const mand=k=>F.kind==="apps"&&MAND.includes(k);
function shrink(f,max,q,sq){return new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas"),x=c.getContext("2d");if(sq){c.width=c.height=sq;const m=Math.min(i.width,i.height);x.drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,sq,sq)}else{const k=Math.min(1,max/Math.max(i.width,i.height));c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);x.drawImage(i,0,0,c.width,c.height)}r(c.toDataURL("image/webp",q))};i.src=URL.createObjectURL(f)})}
async function openForm(kind,id){let d={};
 if(id){d={...S[kind].find(x=>x.id===id)};if(kind==="apps"){const r=await call("app",{id});if(r.error)return alert("Couldn’t load the images. Try again.");d.img=r.img||"";d.shots=r.shots||[]}}
 else if(kind==="apps")d={publisher:"Sito (Owner)",shots:[]};
 F={kind,id,d,hide:{}};(kind==="apps"?AF:TF).forEach(([k])=>{if(id&&!d[k]&&!mand(k))F.hide[k]=1});rf()}
function collect(){(F.kind==="apps"?AF:TF).forEach(([k])=>{const e=$("#f_"+k);if(e)F.d[k]=e.value})}
const imgs=()=>`<div class="row"><small>Main image (always the first preview)</small>${F.d.img?`<div class="th"><img src="${F.d.img}" alt=""><b onclick="collect();F.d.img='';F.d.icon='';rf()">✕</b></div>`:""}<input type="file" accept="image/*" onchange="pm(this)"></div>
<div class="row"><small>Preview images (up to 6)</small><div class="ths">${(F.d.shots||[]).map((s,i)=>`<div class="th"><img src="${s}" alt=""><b onclick="collect();F.d.shots.splice(${i},1);rf()">✕</b></div>`).join("")}</div><input type="file" accept="image/*" multiple onchange="ps(this)"></div>`;
function rf(){const fs=F.kind==="apps"?AF:TF,sh=$(".sheet"),st=sh?sh.scrollTop:0,d=F.d;
 const row=([k,l,t])=>F.hide[k]?"":`<div class="fr">${t?`<textarea id="f_${k}" rows="3" placeholder="${l}">${esc(d[k])}</textarea>`:`<input id="f_${k}" placeholder="${l}" value="${esc(d[k])}">`}${mand(k)?"":`<b role="button" aria-label="Remove ${l}" onclick="rm('${k}')">✕</b>`}</div>${F.kind==="apps"&&PRE[k]?`<div class="chips">${PRE[k].map(v=>`<span class="chip" onclick="fill('${k}',this.textContent)">${esc(v)}</span>`).join("")}</div>`:""}`;
 const gone=fs.filter(([k])=>F.hide[k]);
 modal(`<button class="x" onclick="$('#m').innerHTML=''">✕</button><h2>${F.id?"Edit":"Add"}</h2><p>Tap ✕ to remove a field. Removed fields don’t show on the site.</p>${F.kind==="apps"?imgs():""}${fs.map(row).join("")}${gone.length?`<small style="color:var(--dim)">Removed fields, tap to add back</small><div class="chips">${gone.map(([k,l])=>`<span class="chip" onclick="ad('${k}')">+ ${l}</span>`).join("")}</div>`:""}<button class="btn p" style="margin-top:12px" onclick="save()">Save</button>`);
 const n=$(".sheet");if(n)n.scrollTop=st}
const fill=(k,v)=>{$("#f_"+k).value=v};
function rm(k){collect();F.hide[k]=1;rf()}
function ad(k){collect();delete F.hide[k];rf()}
async function pm(e){const f=e.files[0];if(!f)return;collect();F.d.img=await shrink(f,800,.72);F.d.icon=await shrink(f,0,.8,192);rf()}
async function ps(e){collect();F.d.shots=F.d.shots||[];for(const f of [...e.files]){if(F.d.shots.length>=6)break;F.d.shots.push(await shrink(f,800,.72))}rf()}
async function save(){collect();const fs=F.kind==="apps"?AF:TF,data={};fs.forEach(([k])=>{const v=F.hide[k]?"":String(F.d[k]||"").trim();if(v)data[k]=v});
 if(F.kind==="apps"){if(!data.name||!data.url)return alert("App name and MediaFire link are required.");if(F.d.img)data.img=F.d.img;if(F.d.icon)data.icon=F.d.icon;if(F.d.shots?.length)data.shots=F.d.shots}
 else if(!Object.keys(data).length)return alert("Fill in at least one field.");
 const r=await call("admin",{op:"save",kind:F.kind,id:F.id,data});if(r.ok){$("#m").innerHTML="";await load();tab="admin";draw()}else alert(r.error||"Could not save")}
load();
</script></body></html>
